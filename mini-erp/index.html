<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a4a22">
  <title>Mini-ERP de Feira</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="deslogado">
  <header class="topo">
    <div class="topo-linha">
      <span class="logo" id="logo-empresa">🧾</span>
      <div class="topo-nome">
        <h1 id="nome-empresa">Mini-ERP de Feira</h1>
        <small>Custos · Caixa · Produção · Relatório</small>
      </div>
      <button type="button" class="btn-sair" id="btn-sair">Sair</button>
    </div>
  </header>

  <div class="aviso-demo" role="note">
    ⚠️ Protótipo acadêmico: todos os dados são <strong>ilustrativos/simulados</strong> e não representam números reais de nenhuma empresa.
  </div>

  <section id="tela-login" aria-label="Entrar"></section>

  <main>
    <section id="view-caixa" class="view"></section>
    <section id="view-produtos" class="view"></section>
    <section id="view-producao" class="view"></section>
    <section id="view-relatorio" class="view"></section>
    <section id="view-ajustes" class="view"></section>
  </main>

  <nav class="abas" aria-label="Módulos">
    <button data-view="caixa"><span>🧾</span>Caixa</button>
    <button data-view="produtos"><span>📋</span>Produtos</button>
    <button data-view="producao"><span>🥣</span>Produção</button>
    <button data-view="relatorio"><span>📊</span>Relatório</button>
    <button data-view="ajustes"><span>⚙️</span>Ajustes</button>
  </nav>

  <dialog id="modal">
    <div class="modal-cab">
      <h2 id="modal-titulo"></h2>
      <button type="button" class="btn-icone" id="modal-fechar" aria-label="Fechar">✕</button>
    </div>
    <div id="modal-corpo"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/lib/qrcode.min.js"></script>
  <script src="js/pix.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
